/*
 * This is the build file for the 'app' subproject.
 */

plugins {
    // Javaアプリケーション用プラグイン
    id 'application'

    // JavaFXプラグイン
    id 'org.openjfx.javafxplugin' version '0.1.0'
    
    // (変更点) 
    id 'org.beryx.runtime' version '1.14.2' 
}

version = '1.0.0' 

repositories {
    mavenCentral()
}

// JavaFXの設定
javafx {
    version = "21" // JDK 21 を使う
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.media' ] // 必要なモジュール
}

application {
    // あなたのメインクラス（app/src/main/java の中にあるもの）
    mainClass = 'DepDispSchedulerApp'
}

// 
// 
runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        noConsole = true // 
    }
    jpackage {
        imageName = 'DepDispSchedulerApp' // 
    }
}

// JUnit 5 (テスト用) の設定
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }
    }
}